services:
  - type: web
    name: lv-arquitetura
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Larissa Vasconcellos"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://lv-architecture.com
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      # Banco Postgres no Neon. DB_URL é a string de conexão do painel do Neon
      # (com ?sslmode=require) e é preenchida só no painel do Render.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_URL
        sync: false
      # Sessão em cookie e cache em arquivo: visitas comuns não acessam o
      # banco (regra D9). Não trocar para "database".
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: contato@lv-architecture.com
      - key: MAIL_FROM_NAME
        value: "LV Arquitetura"
      - key: MAIL_CONTACT_TO
        value: larissavasconcellosarquitetura@gmail.com
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
